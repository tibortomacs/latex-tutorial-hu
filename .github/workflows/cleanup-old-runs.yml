name: Cleanup old workflow runs

on:
  push:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but latest 5 runs (repo-wide)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs --paginate --jq '.workflow_runs[].id' \
            | tail -n +6 \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/runs/{}
